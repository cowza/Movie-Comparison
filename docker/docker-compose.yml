services:
  # Hot-reloading development stack against the real provider API.
  backend-local:
    container_name: backend
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    env_file:
      - secrets/local-env
    ports:
      - "5000:5000"
      - "5555:5555"
    volumes:
      - ../backend:/src
      - /src/src/MovieComparison.Api/bin
      - /src/src/MovieComparison.Api/obj
      - /src/src/MovieComparison.Core/bin
      - /src/src/MovieComparison.Core/obj
      - /src/src/MovieComparison.Infrastructure/bin
      - /src/src/MovieComparison.Infrastructure/obj
    profiles:
      - local
    networks:
      - movie-network

  frontend-local:
    container_name: frontend
    build:
      context: ../frontend/app
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/app:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend-local
    profiles:
      - local
    networks:
      - movie-network

  # The production image against the fake upstream. Needs no token.
  app:
    container_name: movie-comparison
    build:
      context: ..
      target: app
    environment:
      - ExternalApiSettings__BaseUrl=http://fake-upstream:8080
      - ExternalApiSettings__ApiToken=fake-token
      - Snapshot__RefreshInterval=00:00:15
      - Snapshot__FailureRetryInterval=00:00:05
      - Snapshot__StaleAfter=00:00:30
    ports:
      - "8080:8080"
    depends_on:
      - fake-upstream
    profiles:
      - demo
    networks:
      - movie-network

  fake-upstream:
    container_name: fake-upstream
    build:
      context: ../backend
      dockerfile: tools/MovieComparison.FakeUpstream/Dockerfile
    environment:
      - FAKE_UPSTREAM_TOKEN=fake-token
    ports:
      - "8081:8080"
    profiles:
      - demo
    networks:
      - movie-network

networks:
  movie-network:
    driver: bridge
